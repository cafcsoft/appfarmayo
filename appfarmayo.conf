<VirtualHost *:80>
    ServerName www.farmaciamayo.com.py
    ServerAlias farmaciamayo.com.py
    
    # Redirigir todo el tráfico HTTP a HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.farmaciamayo.com.py
    ServerAlias farmaciamayo.com.py
    DocumentRoot /var/www/html/appFarmayo/public

    <Directory /var/www/html/appFarmayo/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/farmaciamayo_com_py.crt
    SSLCertificateKeyFile /etc/ssl/private/farmaciamayo_com_py.key
    # SSLCertificateChainFile /etc/ssl/certs/farmaciamayo_com_py.ca-bundle

    ErrorLog /var/log/httpd/appFarmayo-error.log
    CustomLog /var/log/httpd/appFarmayo-access.log combined
</VirtualHost>

